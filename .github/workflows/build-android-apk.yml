name: Build Android APK

# Every merge to main builds the APK and keeps it as a build artifact, so a broken
# build surfaces at merge time rather than when a release is cut. Publishing a
# release builds it again and attaches it to that release. The manual trigger builds
# on demand; pass a tag to also attach it to an existing release.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the APK to (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-android-apk-${{ github.event.release.tag_name || github.ref }}
  # Superseded merges can be dropped; a release build must always finish, since its
  # APK is the release asset.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ClipCascade_Mobile/src/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # android/build.gradle pins these exact versions, and the runner image ships a
      # different NDK. sdkmanager is a no-op for anything already present.
      - name: Install pinned Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Install JS dependencies
        working-directory: ClipCascade_Mobile/src
        run: npm ci --no-audit --no-fund

      # Without the keystore secrets the build still runs, it just produces an
      # unsigned APK. That keeps the workflow usable on a fresh fork before any
      # secrets are configured, rather than failing with a signing error.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set - building an UNSIGNED APK. It cannot be installed as an update over a signed build."
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      # Resolved before the build so the APK carries the version of the release it
      # ships in. Nothing version-related is committed: app/build.gradle defaults to
      # upstream's 1.0/1 and only overrides them when these properties are passed,
      # which keeps the working tree mergeable with upstream.
      #
      # versionCode is derived from the tag rather than a CI counter, so rebuilding a
      # tag reproduces the same number and the number itself says which upstream
      # release the build is based on:
      #   major*1000000 + minor*10000 + patch*100 + fork build
      #   3.2.0-mxyyz.1 -> 3020001, 3.2.0-mxyyz.2 -> 3020002, 3.3.0-mxyyz.1 -> 3030001
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -n "$TAG" ]; then
            ATTACH=true
          else
            # Untagged build (a push to main, or a manual run with no tag): fall back
            # to the version the tree declares, and attach it to nothing.
            TAG="$(jq -r .android version.json)"
            ATTACH=false
          fi

          NAME="${TAG#v}"        # tolerate an optional leading v
          CORE="${NAME%%-*}"     # 3.2.0 out of 3.2.0-mxyyz.1
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"

          for part in "$MAJOR" "$MINOR" "$PATCH"; do
            case "$part" in
              ''|*[!0-9]*)
                echo "::error::Tag '$TAG' is not major.minor.patch[-suffix.N]; cannot derive a versionCode"
                exit 1 ;;
            esac
          done

          # Trailing .N of the suffix is the fork build number; anything else is 0.
          FORK=0
          case "$NAME" in
            *-*)
              CANDIDATE="${NAME##*.}"
              case "$CANDIDATE" in
                ''|*[!0-9]*) FORK=0 ;;
                *)           FORK="$CANDIDATE" ;;
              esac ;;
          esac
          if [ "$FORK" -gt 99 ]; then
            echo "::error::Fork build number $FORK exceeds the 99 reserved per upstream release"
            exit 1
          fi

          CODE=$(( MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + FORK ))

          {
            echo "tag=$TAG"
            echo "name=$NAME"
            echo "code=$CODE"
            echo "attach=$ATTACH"
          } >> "$GITHUB_OUTPUT"
          echo "Building **$NAME** (versionCode \`$CODE\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        working-directory: ClipCascade_Mobile/src/android
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          # gradlew is tracked with mode 0644, so it is not executable on checkout.
          chmod +x gradlew
          set -- --no-daemon assembleRelease \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE"
          if [ "$SIGNED" = "true" ]; then
            set -- "$@" \
              -PMYAPP_UPLOAD_STORE_FILE="$RUNNER_TEMP/release.keystore" \
              -PMYAPP_UPLOAD_STORE_PASSWORD="$STORE_PASS" \
              -PMYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
              -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASS"
          fi
          ./gradlew "$@"

      # Values reach this step as environment variables rather than as ${{ }}
      # interpolated into the script, so a tag containing shell metacharacters is
      # data instead of code.
      - name: Collect and name the APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          OUT=ClipCascade_Mobile/src/android/app/build/outputs/apk/release
          # An unsigned build emits app-release-unsigned.apk instead.
          APK=$(find "$OUT" -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced in $OUT"
            exit 1
          fi

          # Keep the version usable as a file name component.
          SAFE=$(printf '%s' "$VERSION_NAME" | tr -c 'A-Za-z0-9._-' '_')
          NAME="ClipCascade-${SAFE}-android.apk"
          cp "$APK" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Verify the APK signature
        if: steps.keystore.outputs.signed == 'true'
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: clipcascade-android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach the APK to the release
        if: steps.version.outputs.attach == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: gh release upload "$TAG" "$APK_PATH" --clobber
